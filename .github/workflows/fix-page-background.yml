name: Fix page background
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set page background to black
        run: python -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(encoding="utf-8"); marker="page-background-black-fix"; css="<style id=\"page-background-black-fix\">html, body { background:#0b0b0b !important; }</style>"; s=s.replace("</head>",css+"</head>",1) if marker not in s else s; p.write_text(s,encoding="utf-8")'
      - name: Commit app change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Set page background to black" || true
          git push || true
