name: Fix final visibility
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix accidental literal newlines
        run: python -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(encoding="utf-8"); a=s.find("<style id=\"ui-visibility-fix-v1\">"); b=s.find("</style>",a); s=s[:a]+s[a:b+8].replace("\\n","\n")+s[b+8:] if a>=0 and b>=0 else s; p.write_text(s,encoding="utf-8")'
      - name: Add Home button fix
        run: python -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(encoding="utf-8"); m="main-home-button-fix-v2"; css="<style id=\"main-home-button-fix-v2\">#view-home button[onclick*=\"startQuickQuiz\"]{background:#f59e0b!important;color:#111!important;opacity:1!important}#view-home button[onclick*=\"startQuickQuiz\"] i{color:#111!important}#view-home button[onclick*=\"startQuickQuiz\"]:hover,#view-home button[onclick*=\"startQuickQuiz\"]:focus,#view-home button[onclick*=\"startQuickQuiz\"]:focus-visible{background:#fbbf24!important;color:#111!important}</style>"; s=s.replace("</head>",css+"</head>",1) if m not in s else s; p.write_text(s,encoding="utf-8")'
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix literal newlines and home button visibility" || true
          git push || true
