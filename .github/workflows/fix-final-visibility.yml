name: Fix final visibility
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix CSS safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('<style id="ui-visibility-fix-v1">')
          if start >= 0:
              end=s.find('</style>', start)
              if end >= 0:
                  block=s[start:end+8].replace('\\n','\n')
                  s=s[:start]+block+s[end+8:]
          marker='main-home-button-fix-v2'
          if marker not in s:
              css='''
<style id="main-home-button-fix-v2">
/* Keep the existing Home button, only restore its intended visible action styling. */
#view-home button[onclick*="startQuickQuiz"] { background:#f59e0b !important; color:#111 !important; opacity:1 !important; }
#view-home button[onclick*="startQuickQuiz"] i { color:#111 !important; }
#view-home button[onclick*="startQuickQuiz"]:hover, #view-home button[onclick*="startQuickQuiz"]:focus, #view-home button[onclick*="startQuickQuiz"]:focus-visible { background:#fbbf24 !important; color:#111 !important; }
</style>
'''
              s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Fix literal newlines and home button visibility"; git push; fi
