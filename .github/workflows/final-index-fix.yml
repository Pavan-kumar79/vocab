name: Final index fix
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact requested index edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old1 = "if (word.accuracy < 50) word.learningStatus = 'Weak';"
          new1 = "if (word.accuracy < 90) word.learningStatus = 'Weak';"
          old2 = "const overallAccPct = totalAskedOverall > 0 ? Math.round((totalCorrectOverall / totalAskedOverall) * 100) : 0;"
          new2 = "const overallAccPct = totalAskedOverall > 0 ? Math.round((totalCorrectOverall / totalAskedOverall) * 1000) / 10 : 0;"
          if s.count(old1) != 1 or s.count(old2) != 1:
              raise SystemExit(f'Expected exact single matches: weak={s.count(old1)}, accuracy={s.count(old2)}')
          s = s.replace(old1, new1).replace(old2, new2)
          if 'monochrome-interaction-palette' in s:
              raise SystemExit('Trailing monochrome interaction palette still present')
          if not s.rstrip().endswith('</html>'):
              raise SystemExit('index.html does not end at </html>')
          if not all(x in s for x in ['function generateQuestionObject(targetWord, fullBank)', 'isSafeDistractor', 'relatedTerms', 'sameCategory', 'restOfBank']):
              raise SystemExit('Requested generateQuestionObject is missing or incomplete')
          p.write_text(s)
          PY
      - name: Commit index changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          git commit -m 'Fix weak threshold and accuracy precision'
          git push
