name: Load app support scripts

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add support scripts after app code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          for name in ['supabase.js','ocr-fix.js','functional.js']:
              text = re.sub(r'\s*<script\s+src=["\']' + re.escape(name) + r'(?:\?[^"\']*)?["\']\s*></script>\s*', '\n', text)
          marker = '</body>'
          if marker not in text:
              raise SystemExit('Could not find </body> in index.html')
          tags = ('    <script src="supabase.js?v=auth2"></script>\n'
                  '    <script src="ocr-fix.js?v=2"></script>\n'
                  '    <script src="functional.js?v=2"></script>\n')
          text = text.replace(marker, tags + marker, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit change if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add index.html
          git commit -m 'Load functionality patches after cloud bridge'
          git push
