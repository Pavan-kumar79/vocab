name: Load Supabase bridge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject-supabase-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Supabase bridge to index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '    <script src="supabase.js"></script>\n'
          if 'src="supabase.js"' not in text:
              marker = '</head>'
              if marker not in text:
                  raise SystemExit('Could not find </head> in index.html')
              text = text.replace(marker, tag + marker, 1)
              p.write_text(text, encoding='utf-8')
          else:
              print('Supabase bridge is already loaded.')
          PY

      - name: Commit change if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Connect vocabulary app to Supabase bridge'
          git push
