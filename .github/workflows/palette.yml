name: Apply monochrome palette
on:
  push:
    branches: [main]
jobs:
  palette:
    if: contains(github.event.head_commit.message, 'Apply monochrome palette') == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply palette
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = '<style id="monochrome-palette">'
          if marker not in s:
              css = '''<style id="monochrome-palette">
          /* Monochrome palette: black / grey / white only */
          body { background:#0b0b0b !important; color:#f5f5f5 !important; }
          [class~="bg-white"],[class~="bg-slate-50"],[class~="bg-slate-100"] { background:#151515 !important; }
          [class~="dark:bg-slate-800"],[class~="dark:bg-slate-900"] { background:#151515 !important; }
          [class~="bg-slate-800"],[class~="bg-slate-900"] { background:#111 !important; }
          [class~="bg-slate-700"],[class~="bg-slate-600"] { background:#222 !important; }
          [class~="bg-slate-200"],[class~="bg-slate-300"] { background:#d0d0d0 !important; }
          [class~="border-slate-200"],[class~="border-slate-300"],[class~="border-slate-700"] { border-color:#3a3a3a !important; }
          [class~="dark:border-slate-700"],[class~="dark:border-slate-600"] { border-color:#3a3a3a !important; }
          [class*="bg-gradient-to-"] { background:#1a1a1a !important; }
          [class*="text-brand-"],[class*="text-indigo-"],[class*="text-purple-"],[class*="text-sky-"],[class*="text-blue-"], [class*="text-emerald-"],[class*="text-rose-"],[class*="text-amber-"],[class*="text-green-"],[class*="text-red-"],[class*="text-violet-"],[class*="text-cyan-"] { color:#d6d6d6 !important; }
          [class~="text-slate-950"],[class~="text-slate-900"] { color:#111 !important; }
          [class~="text-slate-800"],[class~="text-slate-700"],[class~="text-slate-600"],[class~="text-slate-500"],[class~="text-slate-400"],[class~="text-slate-300"],[class~="text-slate-200"] { color:#cfcfcf !important; }
          [class~="dark:text-white"],[class~="text-white"] { color:#fff !important; }
          [class~="bg-clip-text"] { background-image:none !important; color:#fff !important; }
          .custom-scrollbar::-webkit-scrollbar-track { background:#171717 !important; }
          .custom-scrollbar::-webkit-scrollbar-thumb { background:#555 !important; }
          </style>'''
              s = s.replace('</head>', css + '\n</head>', 1)
              p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Apply monochrome palette"
          git push
