name: Add reason column
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Apply troublesome reason column'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_header = '''                                <th class="p-3.5">Word</th>\n                                <th class="p-3.5">Meaning</th>\n                                <th class="p-3.5">Times Asked</th>'''
          new_header = '''                                <th class="p-3.5">Word</th>\n                                <th class="p-3.5">Meaning</th>\n                                <th class="p-3.5">Reason</th>\n                                <th class="p-3.5">Times Asked</th>'''
          if old_header not in s:
              raise SystemExit('Expected troublesome table header not found')
          s = s.replace(old_header, new_header, 1)
          start = s.index('        function renderTroublesomeTable() {')
          end = s.index('\n        function startQuickQuiz', start)
          block = s[start:end]
          old_tpl_start = block.index('                    tr.innerHTML = `')
          old_tpl_end = block.index('                    `;', old_tpl_start) + len('                    `;')
          new_tpl = '''                    tr.innerHTML = `
                        <td class="p-3.5 font-bold text-slate-900 dark:text-white">${w.word}</td>
                        <td class="p-3.5 text-slate-600 dark:text-slate-300">${w.meaning}</td>
                        <td class="p-3.5 text-xs">
                            ${w.troublesome ? '<span class="px-2 py-0.5 rounded bg-amber-100 text-amber-800 font-bold mr-1">Flagged</span>' : ''}
                            ${w.learningStatus === 'Weak' ? '<span class="px-2 py-0.5 rounded bg-rose-100 text-rose-700 font-bold">Weak (accuracy)</span>' : ''}
                        </td>
                        <td class="p-3.5 text-xs text-slate-500 font-bold">${w.timesAsked} times</td>
                        <td class="p-3.5 text-xs font-bold ${w.accuracy >= 70 ? 'text-emerald-600' : 'text-rose-600'}">${w.accuracy}%</td>
                        <td class="p-3.5 text-right">
                            <button onclick="toggleTroublesomeFlag('${w.id}')" class="px-3 py-1 bg-amber-100 text-amber-800 text-xs font-bold rounded hover:bg-amber-200">
                                Unflag
                            </button>
                        </td>
                    `;'''
          block = block[:old_tpl_start] + new_tpl + block[old_tpl_end:]
          s = s[:start] + block + s[end:]
          p.write_text(s, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Apply troublesome reason column'
          git push
