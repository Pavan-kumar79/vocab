name: Add reason filter
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add reason filter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old1 = '''            <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">\n                <div class="overflow-x-auto">'''
          new1 = '''            <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">\n                <div class="flex items-center justify-between mb-4">\n                    <label for="troublesome-reason-filter" class="text-sm font-bold text-slate-600 dark:text-slate-300">Show by reason</label>\n                    <select id="troublesome-reason-filter" onchange="renderTroublesomeTable()" class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-sm font-semibold text-slate-700 dark:text-slate-200">\n                        <option value="ALL">All</option>\n                        <option value="FLAGGED">Flagged</option>\n                        <option value="WEAK">Weak (accuracy)</option>\n                    </select>\n                </div>\n                <div class="overflow-x-auto">'''
          if old1 not in s: raise SystemExit('HTML insertion point not found')
          s = s.replace(old1, new1, 1)
          old2 = '''            const list = allWordsCache.filter(w => w.troublesome || ((w.timesWrong || 0) > 0 && (w.accuracy || 0) < 90));'''
          new2 = '''            const reasonFilter = document.getElementById('troublesome-reason-filter')?.value || 'ALL';\n            const list = allWordsCache.filter(w => {\n                const flagged = !!w.troublesome;\n                const weak = (w.timesWrong || 0) > 0 && (w.accuracy || 0) < 90;\n                if (reasonFilter === 'FLAGGED') return flagged;\n                if (reasonFilter === 'WEAK') return weak;\n                return flagged || weak;\n            });'''
          if old2 not in s: raise SystemExit('JS filter point not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add reason filter to troublesome words" || exit 0
          git push
