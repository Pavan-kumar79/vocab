name: Apply small semantic colors
on:
  push:
    paths:
      - '.github/workflows/semantic-colors.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply small color accents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<style id="semantic-color-accents">'
          if marker not in s:
              css='''<style id="semantic-color-accents">\n/* Small semantic accents only: keep the monochrome UI, restore meaningful status colors. */\n#daily-streak-button i { color:#f59e0b !important; }\n#nav-troublesome i { color:#f59e0b !important; }\n#mobile-menu #nav-troublesome i { color:#f59e0b !important; }\n</style>\n'''
              s=s.replace('</head>',css+'</head>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Restore small semantic color accents"
          git push
