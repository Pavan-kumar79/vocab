name: Rollback card color experiment
on:
  push:
    paths:
      - '.github/workflows/rollback-card-colors.yml'
permissions:
  contents: write
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove only the card color experiment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s2=re.sub(r'\n<style id="card-semantic-colors">.*?</style>\n<script id="card-semantic-color-logic">.*?</script>\n', '\n', s, count=1, flags=re.S)
          if s2 == s:
              raise SystemExit('Card color experiment not found; no change made.')
          p.write_text(s2, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Revert card color experiment"
          git push
