name: Patch weak-word logic

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = [
              ("const weak = allWordsCache.filter(w => w.learningStatus === 'Weak').length;", "const weak = allWordsCache.filter(w => (w.timesWrong || 0) > 0 && (w.accuracy || 0) < 90).length;"),
              ("candidatePool = candidatePool.filter(w => w.learningStatus === 'Weak');", "candidatePool = candidatePool.filter(w => (w.timesWrong || 0) > 0 && (w.accuracy || 0) < 90);"),
              ("const list = allWordsCache.filter(w => w.troublesome || w.learningStatus === 'Weak');", "const list = allWordsCache.filter(w => w.troublesome || ((w.timesWrong || 0) > 0 && (w.accuracy || 0) < 90));"),
              ("${w.learningStatus === 'Weak' ? '<span class=\"px-2 py-0.5 rounded bg-rose-100 text-rose-700 font-bold\">Weak (accuracy)</span>' : ''}", "${((w.timesWrong || 0) > 0 && (w.accuracy || 0) < 90) ? '<span class=\"px-2 py-0.5 rounded bg-rose-100 text-rose-700 font-bold\">Weak (accuracy)</span>' : ''}"),
              ("if (word.accuracy < 90) word.learningStatus = 'Weak';", "if ((word.timesWrong || 0) > 0 && word.accuracy < 90) word.learningStatus = 'Weak';")
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Missing expected text: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix dynamic weak-word tracking"
          git push
