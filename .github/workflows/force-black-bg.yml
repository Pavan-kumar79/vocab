name: Force black background
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force black page background
        run: python -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(encoding="utf-8"); s=s.replace("<html lang=\"en\" class=\"h-full bg-slate-50\">","<html lang=\"en\" class=\"h-full\" style=\"background:#000 !important;\">"); s=s.replace("<body class=\"h-full text-slate-800 dark:text-slate-100 dark:bg-slate-900 font-sans flex flex-col antialiased selection:bg-brand-500 selection:text-white\">","<body class=\"h-full text-slate-800 dark:text-slate-100 dark:bg-slate-900 font-sans flex flex-col antialiased selection:bg-brand-500 selection:text-white\" style=\"background:#000 !important;\">"); p.write_text(s,encoding="utf-8")'
      - name: Commit app change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Force black page background" || true
          git push || true
