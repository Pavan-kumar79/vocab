name: Cleanup dark mode overrides
on:
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove injected override blocks
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('<style id="monochrome-palette">')
          end = s.find('</head>')
          if start == -1 or end == -1 or start >= end:
              raise SystemExit('Expected cleanup range not found')
          s = s[:start] + s[end:]
          s = s.replace('<html lang="en" class="h-full" style="background:#000 !important;">', '<html lang="en" class="h-full dark">')
          s = s.replace(' style="background:#000 !important;;background:#000 !important;"', '')
          p.write_text(s, encoding='utf-8')
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Clean up injected dark mode overrides" || exit 0
          git push
