name: Final title Vocab
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change page title only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s, n = re.subn(r'<title>\s*.*?\s*</title>', '<title>Vocab</title>', s, count=1, flags=re.I|re.S)
          if n != 1:
              raise SystemExit('Expected exactly one title tag')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit title change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Set page title to Vocab"
          git push
