name: Add Today Quiz Mode
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Today option
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('functional.js')
          s = p.read_text()
          old = "    addMode(select, 'Last7', 'Last 7 Days');"
          new = "    addMode(select, 'Today', 'Today');\n" + old
          if "addMode(select, 'Today', 'Today');" not in s:
              if old not in s:
                  raise SystemExit('Target line not found')
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functional.js
          git diff --cached --quiet || git commit -m "Add Today quiz mode"
          git push
