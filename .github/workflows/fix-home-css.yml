name: Fix Home visual CSS
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize Home CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          a=s.find('<style id="home-visual-restyle">')
          b=s.find('</style>',a)
          if a<0 or b<0: raise SystemExit('style block not found')
          css='''<style id="home-visual-restyle">
          /* Home page visual-only restyle. No logic/data/state changes. */
          #view-home { --home-accent:#3157a6; --home-accent-soft:#eef3ff; --home-muted:#687287; --home-line:#d9deea; color:#172033; }
          #view-home .relative.overflow-hidden.bg-gradient-to-r { background:#243b69 !important; border-radius:14px !important; padding:24px 28px !important; box-shadow:none !important; }
          #view-home .relative.overflow-hidden.bg-gradient-to-r h2 { font-size:1.75rem !important; line-height:1.15 !important; margin-bottom:8px !important; }
          #view-home .relative.overflow-hidden.bg-gradient-to-r p { max-width:46rem !important; margin-bottom:18px !important; color:#dbe4f5 !important; }
          #view-home .relative.overflow-hidden.bg-gradient-to-r > .absolute { display:none !important; }
          #view-home .relative.overflow-hidden.bg-gradient-to-r button { background:#fff !important; color:#243b69 !important; border-radius:9px !important; box-shadow:none !important; transform:none !important; padding:11px 18px !important; font-size:.9rem !important; }
          #view-home .relative.overflow-hidden.bg-gradient-to-r button:hover { background:#eef3ff !important; }
          #view-home .grid.grid-cols-2.md\\:grid-cols-3.lg\\:grid-cols-6 { grid-template-columns:repeat(6,minmax(0,1fr)) !important; gap:0 !important; border-top:1px solid var(--home-line); border-bottom:1px solid var(--home-line); background:transparent !important; }
          #view-home .grid.grid-cols-2.md\\:grid-cols-3.lg\\:grid-cols-6 > div { background:transparent !important; border:0 !important; border-right:1px solid var(--home-line) !important; border-radius:0 !important; box-shadow:none !important; padding:16px 18px !important; min-height:94px; }
          #view-home .grid.grid-cols-2.md\\:grid-cols-3.lg\\:grid-cols-6 > div:last-child { border-right:0 !important; }
          #view-home .grid.grid-cols-2.md\\:grid-cols-3.lg\\:grid-cols-6 > div span[id^="stat-"] { font-size:1.85rem !important; line-height:1 !important; color:var(--home-accent) !important; }
          #view-home .grid.grid-cols-2.md\\:grid-cols-3.lg\\:grid-cols-6 > div > span:first-child { font-size:.68rem !important; line-height:1.2 !important; letter-spacing:.02em !important; text-transform:none !important; color:var(--home-muted) !important; }
          #view-home .grid.grid-cols-2.md\\:grid-cols-3.lg\\:grid-cols-6 > div > div { margin-top:8px !important; }
          #view-home .grid.grid-cols-2.md\\:grid-cols-3.lg\\:grid-cols-6 > div i { color:#7180a0 !important; font-size:.9rem !important; }
          #view-home .grid.grid-cols-2.md\\:grid-cols-3.lg\\:grid-cols-6 > div:nth-child(3) span[id="stat-tested"],#view-home .grid.grid-cols-2.md\\:grid-cols-3.lg\\:grid-cols-6 > div:nth-child(3) i { color:#27734d !important; }
          #view-home .grid.grid-cols-2.md\\:grid-cols-3.lg\\:grid-cols-6 > div:nth-child(4) span[id="stat-weak"],#view-home .grid.grid-cols-2.md\\:grid-cols-3.lg\\:grid-cols-6 > div:nth-child(4) i,#view-home .grid.grid-cols-2.md\\:grid-cols-3.lg\\:grid-cols-6 > div:nth-child(6) span[id="stat-troublesome"],#view-home .grid.grid-cols-2.md\\:grid-cols-3.lg\\:grid-cols-6 > div:nth-child(6) i { color:#b33a45 !important; }
          #view-home .grid.grid-cols-1.md\\:grid-cols-2.gap-6 > div { background:transparent !important; border:0 !important; border-top:1px solid var(--home-line) !important; border-bottom:1px solid var(--home-line) !important; border-radius:0 !important; box-shadow:none !important; padding:18px 0 !important; }
          #view-home .grid.grid-cols-1.md\\:grid-cols-2.gap-6 > div h3 { font-size:1rem !important; }
          #view-home #coverage-percentage { color:var(--home-accent) !important; } #view-home #overall-accuracy-pct { color:#27734d !important; }
          #view-home #coverage-bar { background:var(--home-accent) !important; } #view-home #accuracy-bar { background:#27734d !important; }
          #view-home .grid.grid-cols-1.md\\:grid-cols-2.gap-6 > div .rounded-full { border-radius:999px !important; height:8px !important; }
          #view-home .grid.grid-cols-2.sm\\:grid-cols-3.md\\:grid-cols-5 { gap:0 !important; border-top:1px solid var(--home-line); border-bottom:1px solid var(--home-line); }
          #view-home .grid.grid-cols-2.sm\\:grid-cols-3.md\\:grid-cols-5 > button { background:transparent !important; border:0 !important; border-right:1px solid var(--home-line) !important; border-radius:0 !important; box-shadow:none !important; padding:16px !important; }
          #view-home .grid.grid-cols-2.sm\\:grid-cols-3.md\\:grid-cols-5 > button:last-child { border-right:0 !important; }
          #view-home .grid.grid-cols-2.sm\\:grid-cols-3.md\\:grid-cols-5 > button i { color:var(--home-accent) !important; transform:none !important; }
          #view-home .grid.grid-cols-2.sm\\:grid-cols-3.md\\:grid-cols-5 > button:hover { background:var(--home-accent-soft) !important; }
          #view-home .grid.grid-cols-2.sm\\:grid-cols-3.md\\:grid-cols-5 > button span[id^="cat-count-"] { color:var(--home-muted) !important; }
          @media (max-width:1023px) { #view-home .grid.grid-cols-2.md\\:grid-cols-3.lg\\:grid-cols-6 { grid-template-columns:repeat(3,minmax(0,1fr)) !important; } #view-home .grid.grid-cols-2.md\\:grid-cols-3.lg\\:grid-cols-6 > div:nth-child(3n) { border-right:0 !important; } }
          @media (max-width:639px) { #view-home .relative.overflow-hidden.bg-gradient-to-r { padding:20px !important; } #view-home .relative.overflow-hidden.bg-gradient-to-r h2 { font-size:1.5rem !important; } #view-home .grid.grid-cols-2.md\\:grid-cols-3.lg\\:grid-cols-6 { grid-template-columns:repeat(2,minmax(0,1fr)) !important; } #view-home .grid.grid-cols-2.md\\:grid-cols-3.lg\\:grid-cols-6 > div:nth-child(3n) { border-right:1px solid var(--home-line) !important; } #view-home .grid.grid-cols-2.md\\:grid-cols-3.lg\\:grid-cols-6 > div:nth-child(2n) { border-right:0 !important; } #view-home .grid.grid-cols-2.sm\\:grid-cols-3.md\\:grid-cols-5 > button { border-right:1px solid var(--home-line) !important; } #view-home .grid.grid-cols-2.sm\\:grid-cols-3.md\\:grid-cols-5 > button:nth-child(2n) { border-right:0 !important; } }
          </style>'''
          lines=css.splitlines(True)
          # Remove workflow indentation from the CSS block while preserving CSS whitespace.
          css=''.join(line[10:] if line.startswith('          ') else line for line in lines)
          s=s[:a]+css+s[b+len('</style>'):]
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Normalize Home visual CSS"
          git push
