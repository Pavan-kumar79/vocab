name: Final header Vocab
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change header title only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<h1 class="text-lg font-bold tracking-tight bg-gradient-to-r from-brand-700 to-indigo-700 dark:from-brand-500 dark:to-indigo-400 bg-clip-text text-transparent">SSC CGL Vocab Pro</h1>'
          new = '<h1 class="text-lg font-bold tracking-tight bg-gradient-to-r from-brand-700 to-indigo-700 dark:from-brand-500 dark:to-indigo-400 bg-clip-text text-transparent">Vocab</h1>'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one header title, found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit header title change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Change header title to Vocab"
          git push
