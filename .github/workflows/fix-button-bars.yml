name: Fix button and bar visibility

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply visibility fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'ui-visibility-fix-v1'
          if marker not in s:
              css = r'''\n<style id="ui-visibility-fix-v1">\n/* Final visibility fix: keep the existing layout, make interactive controls and progress bars clearly visible. */\nbutton, .nav-btn { color:#f5f5f5 !important; }\nbutton:hover, button:focus, button:focus-visible, .nav-btn:hover, .nav-btn:focus, .nav-btn:focus-visible { color:#fff !important; background:#2f2f2f !important; }\n[class*="bg-amber-400"], [class*="bg-amber-500"] { background:#f59e0b !important; color:#111 !important; }\n[class*="hover:bg-amber-300"]:hover, [class*="hover:bg-amber-400"]:hover, [class*="hover:bg-amber-500"]:hover { background:#fbbf24 !important; color:#111 !important; }\n[class*="bg-brand-"], [class*="bg-sky-"], [class*="bg-blue-500"], [class*="bg-blue-600"] { background:#0284c7 !important; color:#fff !important; }\n[class*="hover:bg-brand-"]:hover, [class*="hover:bg-sky-"]:hover, [class*="hover:bg-blue-"]:hover { background:#0369a1 !important; color:#fff !important; }\n[class*="bg-emerald-"], [class*="bg-green-"] { background:#16a34a !important; color:#fff !important; }\n[class*="bg-red-"], [class*="bg-rose-"] { background:#dc2626 !important; color:#fff !important; }\n[class*="bg-purple-"], [class*="bg-indigo-"] { background:#4f46e5 !important; color:#fff !important; }\n/* Progress bars: override the broad monochrome background rule only for actual filled bars. */\n#coverage-bar, #accuracy-bar, [id*="progress-bar"] { background:#f59e0b !important; opacity:1 !important; }\n#accuracy-bar { background:#22c55e !important; }\n[class*="progress"] [style*="width"], [style*="width: 0%"], [style*="width:0%"] { background:#777 !important; opacity:1 !important; }\n/* Quiz progress and selected/correct states should never become black. */\n[class*="border-brand-"], [class*="border-sky-"], [class*="border-emerald-"], [class*="border-green-"] { border-color:#38bdf8 !important; }\n</style>\n'''
              s = s.replace('</head>', css + '</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit UI fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No UI changes needed"
          else
            git commit -m "Fix button and progress bar visibility"
            git push
          fi
