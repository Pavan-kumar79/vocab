name: Monochrome Hover Fix
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  fix-palette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add interaction palette
        run: |
          cat >> index.html <<'EOF'
          <style id="monochrome-interaction-palette">
          button:hover, button:focus, button:focus-visible,
          .nav-btn:hover, .nav-btn:focus, .nav-btn:focus-visible,
          [class*="hover:bg-"]:hover, [class*="focus:bg-"]:focus,
          [class*="focus:bg-"]:focus-visible { background:#2a2a2a !important; color:#fff !important; }
          [class*="hover:text-"]:hover, [class*="focus:text-"]:focus,
          [class*="focus:text-"]:focus-visible { color:#fff !important; }
          [class*="hover:border-"]:hover, [class*="focus:border-"]:focus,
          [class*="focus:border-"]:focus-visible { border-color:#777 !important; }
          input, select, textarea { background:#151515 !important; color:#f5f5f5 !important; border-color:#3f3f3f !important; }
          input::placeholder, textarea::placeholder { color:#8a8a8a !important; }
          select option { background:#151515 !important; color:#f5f5f5 !important; }
          input:hover, select:hover, textarea:hover { background:#1d1d1d !important; border-color:#666 !important; }
          input:focus, select:focus, textarea:focus { background:#1d1d1d !important; color:#fff !important; border-color:#888 !important; outline:none !important; box-shadow:0 0 0 1px #888 !important; }
          [class*="bg-amber-"], [class*="bg-blue-"], [class*="bg-indigo-"], [class*="bg-purple-"], [class*="bg-sky-"], [class*="bg-emerald-"], [class*="bg-green-"], [class*="bg-red-"], [class*="bg-rose-"], [class*="bg-violet-"], [class*="bg-cyan-"] { background:#2a2a2a !important; }
          [class*="text-amber-"], [class*="text-blue-"], [class*="text-indigo-"], [class*="text-purple-"], [class*="text-sky-"], [class*="text-emerald-"], [class*="text-green-"], [class*="text-red-"], [class*="text-rose-"], [class*="text-violet-"], [class*="text-cyan-"] { color:#d6d6d6 !important; }
          [class*="hover:bg-amber-"]:hover, [class*="hover:bg-blue-"]:hover, [class*="hover:bg-indigo-"]:hover, [class*="hover:bg-purple-"]:hover, [class*="hover:bg-sky-"]:hover, [class*="hover:bg-emerald-"]:hover, [class*="hover:bg-green-"]:hover, [class*="hover:bg-red-"]:hover, [class*="hover:bg-rose-"]:hover, [class*="hover:bg-violet-"]:hover, [class*="hover:bg-cyan-"]:hover { background:#3a3a3a !important; color:#fff !important; }
          [class*="hover:text-amber-"]:hover, [class*="hover:text-blue-"]:hover, [class*="hover:text-indigo-"]:hover, [class*="hover:text-purple-"]:hover, [class*="hover:text-sky-"]:hover, [class*="hover:text-emerald-"]:hover, [class*="hover:text-green-"]:hover, [class*="hover:text-red-"]:hover, [class*="hover:text-rose-"]:hover, [class*="hover:text-violet-"]:hover, [class*="hover:text-cyan-"]:hover { color:#fff !important; }
          </style>
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply monochrome interaction palette'
          git push
