name: Monochrome Hover Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-palette:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply consistent monochrome interaction palette
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = '<style id="monochrome-interaction-palette">'
          if marker not in s:
              css = '''<style id="monochrome-interaction-palette">
/* Consistent black / grey / white palette for all pages and interaction states. */
button, input, select, textarea { color-scheme: dark !important; }
button:hover, button:focus, button:focus-visible,
.nav-btn:hover, .nav-btn:focus, .nav-btn:focus-visible,
[class*="hover:bg-"]:hover, [class*="focus:bg-"]:focus,
[class*="hover:bg-"]:focus, [class*="focus:bg-"]:focus-visible {
  background-color:#2a2a2a !important;
  color:#ffffff !important;
}
[class*="hover:text-"]:hover, [class*="focus:text-"]:focus,
[class*="focus:text-"]:focus-visible { color:#ffffff !important; }
[class*="hover:border-"]:hover, [class*="focus:border-"]:focus,
[class*="focus:border-"]:focus-visible { border-color:#777777 !important; }
input, select, textarea { background:#151515 !important; color:#f5f5f5 !important; border-color:#3f3f3f !important; }
input::placeholder, textarea::placeholder { color:#8a8a8a !important; }
select option { background:#151515 !important; color:#f5f5f5 !important; }
input:hover, select:hover, textarea:hover { background:#1d1d1d !important; border-color:#666666 !important; }
input:focus, select:focus, textarea:focus { background:#1d1d1d !important; color:#ffffff !important; border-color:#888888 !important; outline:none !important; box-shadow:0 0 0 1px #888888 !important; }
[class*="bg-amber-"], [class*="bg-blue-"], [class*="bg-indigo-"], [class*="bg-purple-"], [class*="bg-sky-"], [class*="bg-emerald-"], [class*="bg-green-"], [class*="bg-red-"], [class*="bg-rose-"], [class*="bg-violet-"], [class*="bg-cyan-"] { background:#2a2a2a !important; }
[class*="text-amber-"], [class*="text-blue-"], [class*="text-indigo-"], [class*="text-purple-"], [class*="text-sky-"], [class*="text-emerald-"], [class*="text-green-"], [class*="text-red-"], [class*="text-rose-"], [class*="text-violet-"], [class*="text-cyan-"] { color:#d6d6d6 !important; }
[class*="hover:bg-amber-"]:hover, [class*="hover:bg-blue-"]:hover, [class*="hover:bg-indigo-"]:hover, [class*="hover:bg-purple-"]:hover, [class*="hover:bg-sky-"]:hover, [class*="hover:bg-emerald-"]:hover, [class*="hover:bg-green-"]:hover, [class*="hover:bg-red-"]:hover, [class*="hover:bg-rose-"]:hover, [class*="hover:bg-violet-"]:hover, [class*="hover:bg-cyan-"]:hover { background:#3a3a3a !important; color:#ffffff !important; }
[class*="hover:text-amber-"]:hover, [class*="hover:text-blue-"]:hover, [class*="hover:text-indigo-"]:hover, [class*="hover:text-purple-"]:hover, [class*="hover:text-sky-"]:hover, [class*="hover:text-emerald-"]:hover, [class*="hover:text-green-"]:hover, [class*="hover:text-red-"]:hover, [class*="hover:text-rose-"]:hover, [class*="hover:text-violet-"]:hover, [class*="hover:text-cyan-"]:hover { color:#ffffff !important; }
</style>'''
              s = s.replace('</head>', css + '\n</head>', 1)
              p.write_text(s)
          PY
      - name: Commit palette fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Apply monochrome palette to all interaction states'
          git push
