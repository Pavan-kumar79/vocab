name: Black background final
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force page background black
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<body\b([^>]*)>', lambda m: '<body' + m.group(1) + ' style="background:#000 !important;">' if 'style=' not in m.group(1) else re.sub(r'style="[^"]*"', lambda x: x.group(0)[:-1] + ';background:#000 !important;"', m.group(0)), s, count=1, flags=re.I)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit app change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Set page background to black" || true
          git push || true
